<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>菜比之家｜後院農場</title>

  <link
    rel="stylesheet"
    href="css/backyard.css"
  >
</head>

<body>

  <!-- 🌾 後院農場 -->
  <main
    id="backyard"
    class="backyard"
  >

    <!-- 場景名稱 -->
    <div class="room-badge">
      🌾 後院農場
    </div>

   <!-- 🗺️ 16:9 遊戲地圖層 -->
<div
  id="backyardMapLayer"
  class="backyard-map-layer"
>

  <!-- 🚪 返回烘焙房 -->
  <button
    id="bakeryEntrance"
    class="bakery-entrance"
    type="button"
    aria-label="返回烘焙房"
  ></button>

    <!-- 🌱 農田互動熱區 -->
  <div id="farmPlots" class="farm-plots">

    <button
  class="farm-plot"
  data-plot-id="1"
  type="button"
  aria-label="農田 1"
>
  <span class="farm-status"></span>
</button>

    <button
  class="farm-plot"
  data-plot-id="2"
  type="button"
  aria-label="農田 2"
>
  <span class="farm-status"></span>
</button>

    <button
  class="farm-plot"
  data-plot-id="3"
  type="button"
  aria-label="農田 3"
>
  <span class="farm-status"></span>
</button>

    <button
  class="farm-plot"
  data-plot-id="4"
  type="button"
  aria-label="農田 4"
>
  <span class="farm-status"></span>
</button>

    <button
  class="farm-plot"
  data-plot-id="5"
  type="button"
  aria-label="農田 5"
>
  <span class="farm-status"></span>
</button>

    <button
  class="farm-plot"
  data-plot-id="6"
  type="button"
  aria-label="農田 6"
>
  <span class="farm-status"></span>
</button>

  </div>
  
 <!-- 👤 玩家分層角色 -->
<div
  id="playerCharacter"
  class="player-character"
>

  <!-- 👤 玩家專屬 Base -->
  <img
    id="playerBase"
    class="player-clothing-layer player-base"
    alt="玩家 Base"
    draggable="false"
  >

  <!-- 🧦 襪子 -->
  <img
    id="playerSocks"
    class="player-clothing-layer player-socks"
    alt=""
    draggable="false"
  >

  <!-- 👟 鞋子 -->
  <img
    id="playerShoes"
    class="player-clothing-layer player-shoes"
    alt=""
    draggable="false"
  >

  <!-- 👖 下身 -->
  <img
    id="playerBottom"
    class="player-clothing-layer player-bottom"
    alt=""
    draggable="false"
  >

  <!-- 👚 上衣 -->
  <img
    id="playerTop"
    class="player-clothing-layer player-top"
    alt=""
    draggable="false"
  >

  <!-- 👗 洋裝 -->
  <img
    id="playerDress"
    class="player-clothing-layer player-dress"
    alt=""
    draggable="false"
  >

  <!-- 🧥 外套 -->
  <img
    id="playerOuterwear"
    class="player-clothing-layer player-outerwear"
    alt=""
    draggable="false"
  >

  <!-- 🎀 頭飾 -->
  <img
    id="playerHeadwear"
    class="player-clothing-layer player-headwear"
    alt=""
    draggable="false"
  >

</div>

</div>

  <!-- 🌱 種植選單 -->
  <div
    id="plantModal"
    class="plant-modal"
    aria-hidden="true"
  >
    <div class="plant-panel">

      <button
        id="closePlantModal"
        class="plant-close"
        type="button"
        aria-label="關閉種植選單"
      >
        ×
      </button>

      <div
        id="plantModalTitle"
        class="plant-title"
      >
        🌱 農田
      </div>

      <div class="plant-subtitle">
        要種什麼？
      </div>

      <div class="seed-list">

        <button
          class="seed-option"
          data-seed="wheat"
          type="button"
        >
          <span class="seed-icon">🌾</span>
          <span class="seed-name">小麥</span>
        </button>

      </div>

      <button
        id="cancelPlant"
        class="plant-cancel"
        type="button"
      >
        取消
      </button>

    </div>
  </div>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../../js/supabase.js"></script>

  <!-- 後院程式 -->
  <script src="js/backyard.js"></script>

</body>

</html>
