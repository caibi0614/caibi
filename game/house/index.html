<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>菜比之家｜1F 客廳</title>

  <!-- 1F 樣式 -->
  <link rel="stylesheet" href="css/house.css">
</head>

<body>

  <!-- =========================
       🏡 菜比之家 1F
  ========================== -->

 <main id="houseContent" class="house-content">

  <!-- 1F 遊戲畫面 -->
  <section class="house-game">

    <!-- 客廳場景 -->
    <div class="living-room" id="livingRoom">
    
   <!-- 🗺️ 跟著 16:9 地圖縮放的互動層 -->
<div class="map-layer">

  <!-- 🍰 通往烘焙房 -->
  <button
    id="bakeryEntrance"
    class="bakery-entrance"
    type="button"
    aria-label="前往烘焙房"
  ></button>

  <!-- 🪜 通往 2F 私人房間 -->
<button
  id="privateRoomEntrance"
  class="private-room-entrance"
  type="button"
  aria-label="前往私人房間"
></button>

</div>

<!-- 左上角會員資訊 -->
<div class="player-info">
  <span>🏡</span>
  <span id="welcomeText">正在確認身分……</span>
</div>

<!-- 右上角登出 -->
<button id="logoutButton" type="button">
  🚪 登出
</button>
<!-- =========================
     👤 玩家角色圖層
========================== -->
<div class="player-layer" id="playerLayer">

  <div
    id="playerCharacter"
    class="player-character"
  >

    <!-- 👤 玩家專屬 Base -->
    <img
      id="playerBase"
      class="player-clothing-layer player-base"
      alt="玩家 Base"
      draggable="false"
    >

    <!-- 🧦 襪子 -->
    <img
      id="playerSocks"
      class="player-clothing-layer player-socks"
      alt=""
      draggable="false"
    >

    <!-- 👟 鞋子 -->
    <img
      id="playerShoes"
      class="player-clothing-layer player-shoes"
      alt=""
      draggable="false"
    >

    <!-- 👖 下身 -->
    <img
      id="playerBottom"
      class="player-clothing-layer player-bottom"
      alt=""
      draggable="false"
    >

    <!-- 👚 上衣 -->
    <img
      id="playerTop"
      class="player-clothing-layer player-top"
      alt=""
      draggable="false"
    >

    <!-- 👗 洋裝 -->
    <img
      id="playerDress"
      class="player-clothing-layer player-dress"
      alt=""
      draggable="false"
    >

    <!-- 🧥 外套 -->
    <img
      id="playerOuterwear"
      class="player-clothing-layer player-outerwear"
      alt=""
      draggable="false"
    >

    <!-- 🎀 頭飾 -->
    <img
      id="playerHeadwear"
      class="player-clothing-layer player-headwear"
      alt=""
      draggable="false"
    >

  </div>

</div>

</div>

  </section>

</main>

  <!-- =========================
       Supabase
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 注意：Supabase 還是在 game/js 裡 -->
  <script src="../js/supabase.js"></script>

  <!-- 1F 專用程式 -->
  <script src="js/house.js"></script>

</body>

</html>
