<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>菜比之家｜1F 客廳</title>

  <!-- 1F 樣式 -->
  <link rel="stylesheet" href="css/house.css">
</head>

<body data-bgm="../../assets/music/afternoon-sun.mp3">

  <!-- =========================
       🏡 菜比之家 1F
  ========================== -->

 <main id="houseContent" class="house-content">

  <!-- 1F 遊戲畫面 -->
  <section class="house-game">

    <!-- 客廳場景 -->
    <div class="living-room" id="livingRoom">
    
   <!-- 🗺️ 跟著 16:9 地圖縮放的互動層 -->
<div class="map-layer">

  <!-- 🍰 通往烘焙房 -->
  <button
    id="bakeryEntrance"
    class="bakery-entrance"
    type="button"
    aria-label="前往烘焙房"
  ></button>

  <!-- 🪜 通往 2F 私人房間 -->
<button
  id="privateRoomEntrance"
  class="private-room-entrance"
  type="button"
  aria-label="前往私人房間"
></button>

</div>

<!-- 左上角會員資訊 -->
<div class="player-info">
  <span>🏡</span>
  <span id="welcomeText">正在確認身分……</span>
</div>

<!-- 右上角登出 -->
<button id="logoutButton" type="button">
  🚪 登出
</button>

<!-- =========================
     📱 菜比手機
========================== -->

<button
  id="gamePhoneButton"
  class="game-phone-button"
  type="button"
  aria-label="打開菜比手機"
>
  📱
</button>

<!-- =========================
     📱 菜比手機主畫面
========================== -->

<div
  id="gamePhonePanel"
  class="game-phone-panel"
  aria-hidden="true"
>
  <div class="game-phone">

    <div class="game-phone-header">
      <strong>📱 菜比手機</strong>

      <button
        id="gamePhoneClose"
        class="game-phone-close"
        type="button"
        aria-label="關閉手機"
      >
        ✕
      </button>
    </div>

    <div class="game-phone-grid">

      <button type="button" data-phone-app="backpack">
        <span>🎒</span>
        <small>背包</small>
      </button>

      <button type="button" data-phone-app="daily">
        <span>🎁</span>
        <small>每日</small>
      </button>

      <button type="button" data-phone-app="gacha">
        <span>🎰</span>
        <small>抽獎</small>
      </button>

      <button type="button" data-phone-app="mail">
        <span>📬</span>
        <small>信箱</small>
      </button>

      <button type="button" data-phone-app="shop">
        <span>🛒</span>
        <small>商店</small>
      </button>

      <button type="button" data-phone-app="redeem">
        <span>🎟️</span>
        <small>兌換碼</small>
      </button>

    </div>

        <!-- =========================
         🎒 背包頁
    ========================== -->

    <div
      id="backpackPage"
      class="phone-page backpack-page"
      hidden
    >

      <div class="backpack-header">

        <button
          id="backpackBackButton"
          class="phone-back-button"
          type="button"
        >
          ← 返回
        </button>

        <strong>🎒 我的背包</strong>

      </div>


      <!-- 💰 玩家貨幣 -->

      <div class="backpack-wallet">

        <div>
          🫘 金豆
          <strong id="backpackGoldBeans">0</strong>
        </div>

        <div>
          💎 鑽石
          <strong id="backpackDiamonds">0</strong>
        </div>

      </div>


      <!-- 🗂️ 分類 -->

      <div class="backpack-tabs">

        <button type="button" data-backpack-tab="all">
          全部
        </button>

        <button type="button" data-backpack-tab="seed">
          🌱 種子
        </button>

        <button type="button" data-backpack-tab="ingredient">
          🥣 食材
        </button>

        <button type="button" data-backpack-tab="material">
          🧺 素材
        </button>

        <button type="button" data-backpack-tab="clothing">
          👗 衣服
        </button>

        <button type="button" data-backpack-tab="furniture">
          🪑 家具
        </button>

      </div>


      <!-- 🎒 物品區 -->

      <div
        id="backpackItems"
        class="backpack-items"
      >
      </div>

    </div>

        <!-- =========================
         🛒 商店頁
    ========================== -->

    <div
      id="shopPage"
      class="phone-page shop-page"
      hidden
    >

      <!-- 商店標題 -->
      <div class="shop-header">

        <button
          id="shopBackButton"
          class="phone-back-button"
          type="button"
        >
          ← 返回
        </button>

        <strong>🛒 菜比商店</strong>

      </div>


      <!-- 玩家金豆 -->
      <div class="shop-wallet">
        🫘 金豆
        <strong id="shopGoldBeans">0</strong>
      </div>


      <!-- 商品區 -->
      <div
        id="shopItems"
        class="shop-items"
      >

        <!-- 🌱 小麥種子 -->
        <div
          class="shop-item"
          data-shop-item="wheat_seed"
        >

          <div class="shop-item-icon">
            🌱
          </div>

          <div class="shop-item-info">

            <strong>小麥種子</strong>

            <small>
              每次購買 ×1
            </small>

          </div>

          <button
            class="shop-buy-button"
            type="button"
            data-buy-item="wheat_seed"
          >
            🫘 10
          </button>

        </div>

      </div>

    </div>
    
        <!-- =========================
         🎁 每日簽到頁
    ========================== -->

    <div
      id="dailyPage"
      class="phone-page daily-page"
      hidden
    >

      <!-- 🎁 標題 -->
      <div class="daily-header">

        <button
          id="dailyBackButton"
          class="phone-back-button"
          type="button"
        >
          ← 返回
        </button>

        <strong>🎁 每日簽到</strong>

      </div>


      <!-- 📅 目前連續簽到 -->
      <div class="daily-status">
        目前第
        <strong id="dailyCurrentDay">1</strong>
        天
      </div>


      <!-- 🎁 七日獎勵 -->
      <div
        id="dailyRewards"
        class="daily-rewards"
      >

                <div class="daily-reward" data-daily-day="1">
          <strong>Day 1</strong>
          <span class="daily-reward-icon">🫘</span>
          <small>金豆 ×500</small>
        </div>

        <div class="daily-reward" data-daily-day="2">
          <strong>Day 2</strong>
          <span class="daily-reward-icon">💎</span>
          <small>鑽石 ×5</small>
        </div>

        <div class="daily-reward" data-daily-day="3">
          <strong>Day 3</strong>
          <span class="daily-reward-icon">🫘</span>
          <small>金豆 ×500</small>
        </div>

        <div class="daily-reward" data-daily-day="4">
          <strong>Day 4</strong>
          <span class="daily-reward-icon">🌱</span>
          <small>肥料 ×10</small>
        </div>

        <div class="daily-reward" data-daily-day="5">
          <strong>Day 5</strong>
          <span class="daily-reward-icon">💎</span>
          <small>鑽石 ×10</small>
        </div>

        <div class="daily-reward" data-daily-day="6">
          <strong>Day 6</strong>
          <span class="daily-reward-icon">🫘</span>
          <small>金豆 ×500</small>
        </div>

        <div
          class="daily-reward daily-reward-final"
          data-daily-day="7"
        >
          <strong>Day 7</strong>
          <span class="daily-reward-icon">💎</span>
          <small>鑽石 ×20</small>
          <em>✨ 七日大獎 ✨</em>
        </div>

      </div>


      <!-- 🎁 領取 -->
      <button
        id="dailyClaimButton"
        class="daily-claim-button"
        type="button"
      >
        🎁 今日簽到
      </button>

    </div>
    
    <!-- =========================
     📬 信箱頁
========================== -->

<div
  id="mailPage"
  class="phone-page mail-page"
  hidden
>

  <!-- 📬 標題 -->
  <div class="mail-header">

    <button
      id="mailBackButton"
      class="phone-back-button"
      type="button"
    >
      ← 返回
    </button>

    <strong>📬 菜比信箱</strong>

  </div>


  <!-- 📮 信箱主內容 -->
<div class="mail-layout">

  <!-- 左側：信件列表 -->
  <div
    id="mailList"
    class="mail-list"
  >

    <div class="mail-empty">
      📭
      <strong>目前沒有信件</strong>
      <small>有新消息時會出現在這裡。</small>
    </div>

  </div>


  <!-- 右側：信件內容 -->
  <div
    id="mailDetail"
    class="mail-detail"
  >

    <div class="mail-detail-empty">
      ✉️
      <strong>選擇一封信件</strong>
      <small>點擊左側信件即可查看內容。</small>
    </div>

  </div>

</div>

</div>

<!-- =========================
     🎟️ 兌換碼頁
========================== -->

<div
  id="redeemPage"
  class="phone-page redeem-page"
  hidden
>

  <!-- 🎟️ 標題 -->
  <div class="redeem-header">

    <button
      id="redeemBackButton"
      class="phone-back-button"
      type="button"
    >
      ← 返回
    </button>

    <strong>🎟️ 兌換碼</strong>

  </div>


  <!-- 🎁 兌換區 -->
  <div class="redeem-content">

    <div class="redeem-icon">
      🎁
    </div>

    <strong class="redeem-title">
      輸入兌換碼
    </strong>

    <small class="redeem-description">
      輸入官方發布的兌換碼即可領取獎勵。
    </small>


    <input
      id="redeemCodeInput"
      class="redeem-input"
      type="text"
      placeholder="請輸入兌換碼"
      autocomplete="off"
      spellcheck="false"
      maxlength="50"
    >


    <button
      id="redeemSubmitButton"
      class="redeem-submit-button"
      type="button"
    >
      🎟️ 立即兌換
    </button>


    <div
      id="redeemMessage"
      class="redeem-message"
      aria-live="polite"
    ></div>

  </div>

</div>

  </div>
</div>

<!-- =========================
     👤 玩家角色圖層
========================== -->
<div class="player-layer" id="playerLayer">

  <div
    id="playerCharacter"
    class="player-character"
  >

    <!-- 👤 玩家專屬 Base -->
    <img
      id="playerBase"
      class="player-clothing-layer player-base"
      alt="玩家 Base"
      draggable="false"
    >

    <!-- 🧦 襪子 -->
    <img
      id="playerSocks"
      class="player-clothing-layer player-socks"
      alt=""
      draggable="false"
    >

    <!-- 👟 鞋子 -->
    <img
      id="playerShoes"
      class="player-clothing-layer player-shoes"
      alt=""
      draggable="false"
    >

    <!-- 👖 下身 -->
    <img
      id="playerBottom"
      class="player-clothing-layer player-bottom"
      alt=""
      draggable="false"
    >

    <!-- 👚 上衣 -->
    <img
      id="playerTop"
      class="player-clothing-layer player-top"
      alt=""
      draggable="false"
    >

    <!-- 👗 洋裝 -->
    <img
      id="playerDress"
      class="player-clothing-layer player-dress"
      alt=""
      draggable="false"
    >

    <!-- 🧥 外套 -->
    <img
      id="playerOuterwear"
      class="player-clothing-layer player-outerwear"
      alt=""
      draggable="false"
    >

    <!-- 🎀 頭飾 -->
    <img
      id="playerHeadwear"
      class="player-clothing-layer player-headwear"
      alt=""
      draggable="false"
    >

  </div>

</div>

</div>

  </section>

</main>

  <!-- =========================
       Supabase
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 注意：Supabase 還是在 game/js 裡 -->
  <script src="../js/supabase.js"></script>

  <!-- 1F 專用程式 -->
  <script src="js/house.js"></script>

  <!-- 🎵 菜比共用背景音樂 -->
<script src="../../assets/music/js/bgm.js"></script>

</body>

</html>
