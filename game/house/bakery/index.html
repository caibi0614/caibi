<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>菜比之家｜烘焙房</title>

  <!-- 🍰 烘焙房 CSS -->
  <link
    rel="stylesheet"
    href="css/bakery.css"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <main
    id="bakeryRoom"
    class="bakery-room"
  >

    <!-- 🍰 左上角房間名稱 -->
    <div class="room-badge">
      🍰 烘焙房
    </div>

<!-- 🗺️ 烘焙房 16:9 遊戲地圖層 -->
<div
  id="bakeryMapLayer"
  class="bakery-map-layer"
>

  <!-- 🚪 左側拱門｜回客廳 -->
  <button
    id="livingRoomEntrance"
    class="living-room-entrance"
    type="button"
    aria-label="回到客廳"
  ></button>

  <!-- 🌾 右側花園門｜前往後院 -->
  <button
    id="backyardEntrance"
    class="backyard-entrance"
    type="button"
    aria-label="前往後院農場"
  ></button>

    <!-- 🍳 中央料理工作台互動區 -->
  <button
    id="cookingStation"
    class="cooking-station"
    type="button"
    aria-label="開始料理"
  ></button>

  <!-- 👤 玩家分層角色 -->
<div
  id="playerCharacter"
  class="player-character"
>

  <!-- 👤 玩家專屬 Base -->
  <img
    id="playerBase"
    class="player-clothing-layer player-base"
    alt="玩家 Base"
    draggable="false"
  >

  <!-- 🧦 襪子 -->
  <img
    id="playerSocks"
    class="player-clothing-layer player-socks"
    alt=""
    draggable="false"
  >

  <!-- 👟 鞋子 -->
  <img
    id="playerShoes"
    class="player-clothing-layer player-shoes"
    alt=""
    draggable="false"
  >

  <!-- 👖 下身 -->
  <img
    id="playerBottom"
    class="player-clothing-layer player-bottom"
    alt=""
    draggable="false"
  >

  <!-- 👚 上衣 -->
  <img
    id="playerTop"
    class="player-clothing-layer player-top"
    alt=""
    draggable="false"
  >

  <!-- 👗 洋裝 -->
  <img
    id="playerDress"
    class="player-clothing-layer player-dress"
    alt=""
    draggable="false"
  >

  <!-- 🧥 外套 -->
  <img
    id="playerOuterwear"
    class="player-clothing-layer player-outerwear"
    alt=""
    draggable="false"
  >

  <!-- 🎀 頭飾 -->
  <img
    id="playerHeadwear"
    class="player-clothing-layer player-headwear"
    alt=""
    draggable="false"
  >

</div>

</div>

<!-- =========================
     🍳 料理介面
========================= -->
<div
  id="cookingModal"
  class="cooking-modal"
  aria-hidden="true"
>
  <div class="cooking-panel">

<!-- 📖 食譜書 -->
<button
  id="recipeBookButton"
  class="recipe-book-button"
  type="button"
  aria-label="打開食譜書"
>
  <span class="recipe-book-icon">📖</span>
  <span class="recipe-book-text">食譜</span>
</button>

    <button
      id="closeCookingModal"
      class="cooking-close"
      type="button"
      aria-label="關閉料理介面"
    >
      ×
    </button>

  <div
  id="cookingPage"
  class="cooking-page"
>

    <h2 class="cooking-title">
      🍰 開始料理
    </h2>

    <div class="cooking-bowl-area">

  <div class="cooking-bowl-placeholder">
    🥣
  </div>

  <div
    id="bowlIngredients"
    class="bowl-ingredients"
  ></div>

  <p
    id="cookingHint"
    class="cooking-hint"
  >
    選擇食材放進攪拌盆
  </p>

</div>

    <div class="cooking-ingredients">
      <p class="cooking-section-title">
        食材
      </p>

  <div
  id="ingredientList"
  class="ingredient-list"
>
  <button
    class="ingredient-item"
    type="button"
    data-ingredient="wheat"
  >
    <span class="ingredient-icon">🌾</span>
    <span class="ingredient-name">小麥</span>
  </button>

  <button
    class="ingredient-item"
    type="button"
    data-ingredient="milk"
  >
    <span class="ingredient-icon">🥛</span>
    <span class="ingredient-name">牛奶</span>
  </button>

  <button
    class="ingredient-item"
    type="button"
    data-ingredient="egg"
  >
    <span class="ingredient-icon">🥚</span>
    <span class="ingredient-name">雞蛋</span>
  </button>
</div>

    </div>

        <!-- 🎂 料理成品 -->
    <div
      id="productSection"
      class="cooking-products"
      hidden
    >
      <p class="cooking-section-title">
        料理成品
      </p>

      <div
        id="productList"
        class="product-list"
      ></div>
    </div>
    
    <button
      id="startCookingButton"
      class="start-cooking-button"
      type="button"
      disabled
    >
      開始料理
    </button>

    </div>

  <!-- =========================
     📖 食譜書頁面
========================= -->
<div
  id="recipeBookPage"
  class="recipe-book-page"
  hidden
>

  <h2 class="recipe-page-title">
    📖 食譜書
  </h2>

  <section class="recipe-section">

    <h3 class="recipe-section-title">
      基礎加工
    </h3>

    <div class="recipe-card">
      <span class="recipe-result">
        🥣 麵粉 ×1
      </span>

      <span class="recipe-arrow">
        ←
      </span>

      <span class="recipe-material">
        🌾 小麥 ×3
      </span>
    </div>

    <div class="recipe-card">
      <span class="recipe-result">
        🧈 奶油 ×1
      </span>

      <span class="recipe-arrow">
        ←
      </span>

      <span class="recipe-material">
        🥛 牛奶 ×1
      </span>
    </div>

  </section>


  <section class="recipe-section">

    <h3 class="recipe-section-title">
      料理食譜
    </h3>

  <div class="recipe-card">
  <span class="recipe-result">
    🎂 蛋糕 ×1
  </span>

  <span class="recipe-arrow">
    ←
  </span>

  <span class="recipe-material">
    🥣 麵粉 ×2＋🧈 奶油 ×1＋🥚 雞蛋 ×2
  </span>
</div>

    <div class="recipe-empty">
      還沒有其他食譜 🍪
    </div>

  </section>

</div>

  </div>
</div>

  </main>


  <!-- Supabase 設定 -->
  <script src="../../js/supabase.js"></script>

  <!-- 🍰 烘焙房 JS -->
  <script src="js/bakery.js"></script>

</body>

</html>
